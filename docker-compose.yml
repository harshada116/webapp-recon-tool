version: "3.9"
services:
  recon-tool:
    build: .
    ports:
      - "5001:5001"
    environment:
      - RECON_TOOL_SECRET_KEY=${RECON_TOOL_SECRET_KEY:?set a random secret key}
    restart: unless-stopped
    # Screenshot capture launches headless Chromium inside the container;
    # shm_size avoids Chrome crashing from the default tiny /dev/shm.
    shm_size: "1gb"
